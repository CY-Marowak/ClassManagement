<!doctype html>
<html lang="zh-Hant">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>CM · 農場夥伴美術預覽</title>
  <link rel="stylesheet" href="preview.css?v=2" />
  <main>
    <header>
      <span class="eyebrow">CM / VISUAL STUDY 01</span>
      <h1>一起長大的農場夥伴</h1>
      <p>兩位夥伴、三個成長階段。先看看你喜歡的模樣。</p>
      <span class="badge">獨立樣本 · 操作不影響正式資料</span>
    </header>
    <section class="workspace">
      <div class="stage-panel">
        <div class="stage-heading">
          <h2 id="heading">貓夥伴</h2>
          <output id="growth"></output>
        </div>
        <div class="farm" aria-label="農場動作預覽">
          <div class="sun"></div>
          <div class="cloud"></div>
          <div class="hill"></div>
          <div class="fence"></div>
          <span class="flower flower-one">✿</span
          ><span class="flower flower-two">✿</span>
          <div id="traveller">
            <div id="size"><div id="actor"></div></div>
          </div>
          <span class="farm-label">OUR LITTLE FARM</span>
        </div>
        <p id="notice" role="status">待機中，試試讓夥伴散步。</p>
      </div>
      <aside>
        <h2>樣本控制</h2>
        <label
          >代表動物<select id="animal">
            <option value="cat">貓 · 既有種類</option>
            <option value="cow">牛 · 新增種類</option>
          </select></label
        >
        <label
          >成長等級<select id="level">
            <option>1</option>
            <option>4</option>
            <option>5</option>
            <option>9</option>
            <option>10</option>
            <option>20</option>
            <option>21</option>
            <option>22</option>
          </select></label
        >
        <div class="actions">
          <button id="idle" aria-pressed="true">待機</button
          ><button id="walk" aria-pressed="false">走動</button>
        </div>
        <button id="feed" class="primary">預覽餵食成功</button
        ><button id="fail">預覽餵食失敗</button>
        <label class="check"
          ><input id="static" type="checkbox" />靜態模式</label
        >
        <p id="motion-status" class="hint" role="status"></p>
        <p class="hint">
          同階段每級增加初始尺寸的 3%；Lv.21 起固定為 1.60
          倍。此處可查看所有樣本，正式養成不預告未解鎖造型。
        </p>
      </aside>
    </section>
    <section>
      <div class="section-heading">
        <h2>學生形象</h2>
        <p>靜態角色，和班級夥伴使用相同美術語言。</p>
      </div>
      <div id="portraits" class="portraits"></div>
    </section>
    <section>
      <div class="section-heading">
        <h2>成長對照</h2>
        <p>共用腳底與可見高度基準，換階段不縮小。</p>
      </div>
      <div id="comparison" class="comparison"></div>
    </section>
    <footer>
      原創 SVG 向量樣本 · 圓潤輪廓 / 暖色描邊 / 草地農場<br />這是待確認的美術提案，尚未替換線上角色。
    </footer>
  </main>
  <script src="preview.js?v=2"></script>
</html>
