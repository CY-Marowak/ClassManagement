[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "node_modules", "migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
files = ["backend/config", "backend/core"]
exclude = ["migrations", "tests"]
mypy_path = "backend"
check_untyped_defs = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"
